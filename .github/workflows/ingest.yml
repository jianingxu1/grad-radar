name: Ingest job sources

on:
  schedule:
    - cron: "0,15,30,45 8-20 * * *"
      timezone: "America/Los_Angeles"
    - cron: "0 1,3,5,7,21,23 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      LOG_LEVEL: INFO
    steps:
      - name: Check out the default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install the ingestion worker
        run: uv sync --locked --no-dev

      - name: Ingest job sources
        run: uv run --no-sync python -m app.cli ingest
